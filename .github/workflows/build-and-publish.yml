name: Build and Publish Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Name the elevation data
        id: elevation
        run: echo "key=$(git lfs ls-files --long --include 'elevation/tiles/*' | cut -d ' ' -f 1 | sort | sha256sum | cut -c 1-64)" >> "$GITHUB_OUTPUT"

      - name: Restore elevation data
        uses: actions/cache@v6
        with:
          path: .git/lfs/objects
          key: elevation-lfs-${{ steps.elevation.outputs.key }}

      - name: Fetch elevation data
        run: |
          git lfs pull --include 'elevation/tiles/*'
          touch -d @0 elevation/tiles/* elevation/tiles

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Collect build stamp
        id: stamp
        run: |
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ github.event_name == 'pull_request' && 'foerderstrecke:pr' || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ steps.stamp.outputs.commit }}
            BUILD_TIME=${{ steps.stamp.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        if: github.event_name == 'pull_request'
        run: |
          docker run -d --name smoke -p 8000:8000 foerderstrecke:pr
          for attempt in $(seq 1 30); do
            sleep 1
            curl -fs http://127.0.0.1:8000/api/health && break
          done
          curl -fs http://127.0.0.1:8000/api/health | grep -q '"elevation":"sonny'
          curl -fs -X POST -H 'Content-Type: application/json' -d '{"points":[[51.7991,10.6156]]}' \
            http://127.0.0.1:8000/api/elevation/points | grep -q '"heights":\[11[0-9][0-9]'
          token=$(curl -fs -X POST -H 'Content-Type: application/json' -d '{"kind":"task","document":{}}' \
            http://127.0.0.1:8000/api/shares | python3 -c 'import json, sys; print(json.load(sys.stdin)["token"])')
          curl -fs "http://127.0.0.1:8000/api/shares/$token" | grep -q '"kind":"task"'
          curl -fs http://127.0.0.1:8000/ | grep -q '<title>Förderstrecke'
          curl -fs -D - -o /dev/null http://127.0.0.1:8000/planer | grep -qi "x-robots-tag: noindex"
          docker rm -f smoke
